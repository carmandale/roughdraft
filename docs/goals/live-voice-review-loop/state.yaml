      - "Grill-me pass selected cohesive Live Voice Review Loop shape."
      - "Shaping still needs to challenge the first pass before planning."
    purpose_source_sections:
      - "Source (verbatim)"
      - "Problem"
      - "Requirements"
      - "Acceptance Criteria"

  purpose_contract:
    confirmation: user_confirmed
    tangible_outcome: "Roughdraft's live voice review loop is visibly trustworthy from speech capture through external-agent reply."
    done_proof:
      - "Dale workflow reaches finalize or a truthful blocker."
      - "Automated verification required by the approved plan passes."
      - "AVP/manual two-round review demonstrates timestamps, status truth, and watcher auto-rearm."
    false_positives:
      - "Spec exists but shaping did not challenge it."
      - "UI looks cool but still lies about agent state."
      - "One handoff works but the watcher does not rearm."
      - "Tests pass without the manual AVP workflow proof."
    required_outcome_checks:
      - id: OC1
        description: "Shaping challenges and confirms or revises the selected shape."
        status: done
        evidence:
          - "specs/001-live-voice-review-loop/shaping-transcript.md"
          - "specs/001-live-voice-review-loop/spec.md"
          - "docs/goals/live-voice-review-loop/notes/T002-codex-shape.md"
      - id: OC2
        description: "Planning records implementation slices, risks, and AVP/manual proof."
        status: done
        evidence:
          - "specs/001-live-voice-review-loop/plan.md"
          - "specs/001-live-voice-review-loop/tasks.md"
          - "specs/001-live-voice-review-loop/planning-transcript.md"
          - "docs/goals/live-voice-review-loop/notes/T003-codex-plan.md"
      - id: OC3
        description: "Implementation changes app/CLI/server behavior, not just docs."
        status: done
        evidence:
          - "specs/001-live-voice-review-loop/tasks.md"
          - "specs/001-live-voice-review-loop/integration-proof.md"
          - "commit fc57577 test(spec): record live review loop verification"
      - id: OC4
        description: "Verification proves no false agent-working state and at least two handoff events through continuous watch."
        status: done
        evidence:
          - "specs/001-live-voice-review-loop/integration-proof.md"
          - "specs/001-live-voice-review-loop/tasks.md"
          - "commit fc57577 test(spec): record live review loop verification"
      - id: OC5
        description: "Finalize closes the bead only after full user outcome is met or truthfully blocked."
        status: pending
        evidence: []

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  operator_input_pause_required: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  purpose_contract_required: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
  selected: local
  local:
    status: starting
    url: null
    command: "npx goalbuddy board /Users/dalecarman/dev/roughdraft/docs/goals/live-voice-review-loop"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

workflow:
  profile: dale_codex
  sequence:
    - command: "$issue"
      purpose: "Create or confirm the bead-backed spec."
      when: "Already complete for specs/001-live-voice-review-loop/."
    - command: "$codex-shape"
      purpose: "Challenge and refine the Live Voice Review Loop shape before planning."
      when: "Active next step."
    - command: "$codex-plan"
      purpose: "Create plan.md, tasks.md, planning transcript, and plan provenance."
      when: "Run after shaping completes."
    - command: "$codex-review"
      purpose: "Get a fresh independent Codex approval of the plan."
      when: "Run after $codex-plan and before $codex-implement."
    - command: "$codex-implement"
      purpose: "Implement the approved plan with verification."
      when: "Run after $codex-review approves."
    - command: "$code-verify"
      purpose: "Run independent post-implementation verification."
      when: "Run after $codex-implement records implement-receipt.md."
    - command: "$finalize"
      purpose: "Close the bead, create final handoff, commit, and push."
      when: "Run only after $code-verify approval."

active_task: null

